services:
  - type: web
    name: aether-vault
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /app/data
    disk:
      name: aethervault-sqlite-data
      mountPath: /app/data
      sizeGB: 5
