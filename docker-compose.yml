services:
  aethervault:
    build: .
    container_name: aethervault-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
    volumes:
      - aethervault_data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: aethervault-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - aethervault

volumes:
  aethervault_data:
  caddy_data:
  caddy_config:
